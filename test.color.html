<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>測試顏色</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <p class="text-primary fs-1 text-end">text-primary</p>
    <p class="text-primary-emphasis fs-1 fw-bold">text-primary-emphasis</p>
    <p class="text-secondary fs-3 text-center">text-secondary</p>
    <p class="text-success h2">text-success</p>
    <p class="text-danger">text-danger</p>
    <p class="text-warning display-1">text-warning</p>
    <p class="text-info bg-dark">text-info</p>
    <p class="text-light display-1 ">text-info</p>
    <p class="text-black bg-primary m-0">text-info</p>
    <p class="text-black bg-primary-subtle ">text-info-subtle</p>
    <p class="text-white bg-success m-0">text-info</p>
    <p class="text-white bg-success-subtle ">text-info-subtle</p>
    <p class="text-dark bg-danger m-0">text-info</p>
    <p class="text-dark bg-danger-subtle">text-info-subtle</p>
    <p class="text-light bg-warning m-0">text-info</p>
    <p class="text-black bg-warning-subtle m-0">text-info-subtle</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" ></script>
  </body>
</html>
