<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flickr 照片輪播</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/pageContent2.css" />
  </head>
  <body>
    <!-- 導覽列 -->
    <nav
      class="navbar navbar-expand-sm bg-body-tertiary sticky-top"
      data-bs-theme="dark"
    >
      <div class="container">
        <a class="navbar-brand" href="#">Flickr</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-current="page"
                href="#"
              >
                發掘
              </a>
              <div class="dropdown-menu">123</div>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#">Something else here</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>

          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <header class="bg-dark h700px">
      <div id="carouselExample" class="carousel slide w-100 h-100">

        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="position-relative active" aria-current="true" aria-label="Slide 1">
            <img
              src="https://images.pexels.com/photos/29372969/pexels-photo-29372969.jpeg"
              class="w30px h30px object-fit-cover position-absolute start-0 top-0"
              alt="..."
            />
          </button>
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2" class="position-relative">
            <img
              src="https://images.pexels.com/photos/37768860/pexels-photo-37768860.jpeg"
              class="w30px h30px object-fit-cover position-absolute start-0 top-0"
              alt="..."
            />
          </button>
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3" class="position-relative">
            <img
              src="https://images.pexels.com/photos/16202422/pexels-photo-16202422.jpeg"
              class="w30px h30px object-fit-cover position-absolute start-0 top-0"
              alt="..."
            />
          </button>
        </div>

        <div class="carousel-inner w-100 h-100">
          <div class="carousel-item active w-100 h-100">
            <img
              src="https://images.pexels.com/photos/29372969/pexels-photo-29372969.jpeg"
              class="w-100 h-100 object-fit-contain"
              alt="..."
            />
          </div>
          <div class="carousel-item w-100 h-100">
            <img
              src="https://images.pexels.com/photos/37768860/pexels-photo-37768860.jpeg"
              class="w-100 h-100 object-fit-contain"
              alt="..."
            />
          </div>
          <div class="carousel-item w-100 h-100">
            <img
              src="https://images.pexels.com/photos/16202422/pexels-photo-16202422.jpeg"
              class="w-100 h-100 object-fit-contain"
              alt="..."
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </header>

    <footer class="bg-dark">
      <div class="container">
        <nav class="nav border-bottom justify-content-between">
          <a class="nav-link text-white" href="#">關於</a>
          <a class="nav-link text-white" href="#">工作機會</a>
          <a class="nav-link text-white" href="#">Blog</a>
          <a class="nav-link text-white" href="#">登廣告</a>
          <a class="nav-link text-white" href="#">開發人員</a>
          <a class="nav-link text-white" href="#">Cookies</a>
          <a class="nav-link text-white" href="#">指南</a>
          <a class="nav-link text-white" href="#">服務中心</a>
          <a class="nav-link text-white" href="#">檢舉濫用</a>
          <a class="nav-link text-white" href="#">繁體中文</a>
        </nav>

        <nav class="nav">
          <a class="nav-link text-white" href="#">Link</a>
          <a class="nav-link text-white" href="#">Link</a>
          <a class="nav-link text-white ms-auto" href="#">Link</a>
          <a class="nav-link text-white" href="#">Link</a>
        </nav>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
