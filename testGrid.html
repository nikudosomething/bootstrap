<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>格狀系統</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/testGrid.css" />
  </head>
  <body>
    <!-- rwd 1 用 col 來撰寫 -->
    <div class="container mb-5">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4">
        <div class="col">
          <div class="box">1</div>
        </div>
        <div class="col">
          <div class="box">2</div>
        </div>
        <div class="col">
          <div class="box">3</div>
        </div>
        <div class="col">
          <div class="box">4</div>
        </div>
        <div class="col">
          <div class="box">5</div>
        </div>
        <div class="col">
          <div class="box">6</div>
        </div>
      </div>
    </div>
    <!-- .container>.row>.col*6>.box>{$} -->
    <div class="container mb-5">
      <div class="row">
        <!-- lg不等欄寬 總數加起來12 -->
        <div class="col-12 col-sm-6 col-md-3 col-lg-4">
          <div class="box">1</div>
        </div>
        <div class="col-12 col-sm-6 col-md-3 col-lg-8">
          <div class="box">2</div>
        </div>
        <div class="col-12 col-sm-6 col-md-3 col-lg-9">
          <div class="box">3</div>
        </div>
        <div class="col-12 col-sm-6 col-md-3 col-lg-3">
          <div class="box">4</div>
        </div>
        <div class="col-12 col-sm-6 col-md-3 col-lg-6">
          <div class="box">5</div>
        </div>
        <div class="col-12 col-sm-6 col-md-3 col-lg-6">
          <div class="box">6</div>
        </div>
      </div>
    </div>

    <!-- 超過 12 會怎樣 -->
    <div class="container">
      <div class="row">
        <!-- .col*6>.box>{$} -->
        <div class="col-4">
          <div class="box">1</div>
        </div>
        <div class="col-4">
          <div class="box">2</div>
        </div>
        <div class="col-7">
          <div class="box">3</div>
        </div>
        <div class="col-5">
          <div class="box">4</div>
        </div>
        <div class="col-5">
          <div class="box">5</div>
        </div>
        <div class="col-2">
          <div class="box">6</div>
        </div>
      </div>
    </div>
    <!-- 左三右九 -->
    <div class="container h-100">
      <div class="row h-100">
        <div class="col-3">
          <div class="bg-primary-subtle h-100"></div>
        </div>
        <div class="col">
          <div class="bg-primary-subtle h-100"></div>
        </div>
      </div>
    </div>
    <!-- 3欄(自動計算) -->
    <div class="container h-100">
      <div class="row h-100">
        <div class="col">
          <div class="bg-success-subtle h-100"></div>
        </div>
        <div class="col">
          <div class="bg-success-subtle h-100"></div>
        </div>
        <div class="col">
          <div class="bg-success-subtle h-100"></div>
        </div>
      </div>
    </div>
    <!-- 一欄(自動計算) -->
    <div class="container h-100">
      <div class="row h-100">
        <div class="col">
          <div class="bg-danger-subtle h-100"></div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
