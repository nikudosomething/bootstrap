<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaceBook版型練習</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/pageFacebook.css">
  </head>
  <body>
    <nav class="h50px bg-fb1">
      <div class="container h-100 d-flex align-items-center">
        <i class="fa-brands fa-square-facebook fs-2 text-light"></i>

      <div class="input-group input-group-sm trs1 w300px" id="search-bar">
        <span class="input-group-text">搜尋</span>
        <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
        <span class="input-group-text">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
      </div>

      <div class="img-head w30px h30px bg-fb7 rounded-circle ms-auto"></div>

      <div class="text-light">首頁</div>
      <div class="text-light">建立</div>
      <i class="fa-solid fa-user-group"></i>
      <i class="fa-solid fa-comment"></i>
      <i class="fa-solid fa-bell"></i>
      <i class="fa-solid fa-circle-question"></i>
      <i class="fa-sharp fa-solid fa-sort-down"></i>
    </nav>
    <main>
      <div class="container"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" ></script>
    <script>
      const searchBar = document.querySelector("#search-bar");

      searchBar.addEventListener("focusin", (event) => {
        event.currentTarget.classList.add("w400px");
      });

      searchBar.addEventListener("focusout", (event) => {
        event.currentTarget.classList.remove("w400px");
      });
    </script>
  </body>
</html>
