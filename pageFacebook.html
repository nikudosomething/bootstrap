<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaceBook版型練習</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/pageFacebook.css">
  </head>
  <body>
    <nav class="h50px bg-fb1">
      <div class="container h-100 d-flex align-items-center">
        <i class="fa-brands fa-square-facebook fs-2 text-light"></i>

      <div class="input-group input-group-sm trs1 w300px" id="search-bar">
        <span class="input-group-text">搜尋</span>
        <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
        <span class="input-group-text">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
      </div>

      <div class="img-head w30px h30px bg-fb7 rounded-circle ms-auto me-4"></div>

      <div class="text-light me-4">首頁</div>
      <div class="text-light me-4">建立</div>
      <i class="fa-solid fa-user-group fs-4 me-2"></i>
      <i class="fa-solid fa-comment fs-4 me-2"></i>
      <i class="fa-solid fa-bell fs-4 me-2"></i>
      <i class="fa-solid fa-circle-question fs-4 me-2"></i>
      <i class="fa-sharp fa-solid fa-sort-down"></i>
    </nav>
    <main>
      <div class="container">
        <div class="row">
          <div class="col-2 py-2">
            <div class="hstack gap-2 mb-3 placeholder-glow">
              <!-- 頭貼 -->
              <div class="img-head placeholder w30px h30px bg-fb3 rounded-circle "></div>
              <span class="placeholder col-2"></span>
              <span class="placeholder col-3"></span>
            </div>

            <!-- 1 -->
            <div class="d-flex align-items-center gap-2 placeholder-glow mb-1">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-5"></span>
              <i class="fa-solid fa-ellipsis ms-auto"></i>
            </div>

            <div class="d-flex align-items-center gap-2 placeholder-glow mb-1">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-5"></span>
            </div>

            <div class="d-flex align-items-center gap-2 placeholder-glow mb-1 ">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-5"></span>
              <div class="w10px h10px rounded-circle bg-danger ms-auto"></div>
            </div>

            <div class="d-flex align-items-center gap-2 placeholder-glow mb-3">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-5"></span>
              <div class="w10px h10px rounded-circle bg-danger ms-auto"></div>
            </div>

            <!-- 2 -->
            <div class="mb-2 placeholder-glow">
              <span class="placeholder col-4"></span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-1 placeholder-glow">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-6"></span>
              <span class="placeholder col-1 ms-auto"></span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-1 placeholder-glow">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-5"></span>
              <span class="placeholder col-1 ms-auto"></span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-1 placeholder-glow">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-3"></span>
              <span class="placeholder col-1 ms-auto"></span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-1 placeholder-glow">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-7"></span>
              <span class="placeholder col-1 ms-auto"></span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-1 placeholder-glow">
              <div class="icon placeholder w30px h30px bg-fb3 rounded-1"></div>
              <span class="placeholder col-6"></span>
              <span class="placeholder col-1 ms-auto"></span>
            </div>
            
          </div>
          <!-- CARD-1 -->
          <!-- 中間區塊-1 -->
          <div class="col py-2 placeholder-glow">
            <div class="card">
              <div class="card-header bg-white border-bottom-0">
                <div class="d-flex gap-1">
                  <div class="img-head placeholder w50px h50px bg-fb3 rounded-circle"></div>
                  <div class="flex-fill">
                  <!-- 1-1 -->
                    <div>
                      <span class="placeholder col-6"></span>
                    </div>
                  <!-- 1-2 -->
                    <div>
                      <span class="placeholder col-2"></span>
                      <i class="fa-solid fa-earth-americas"></i>
                    </div>
                  </div>
                  <div class="ms-auto">
                    <i class="fa-solid fa-ellipsis "></i>
                  </div>
                </div>
              </div>

              <!-- 中間區塊-2 -->
              <div class="card-body px-0">
                <div class="px-3 pb-2">
                  <div>
                    <span class="placeholder col-6"></span>
                    <span class="placeholder col-2"></span>
                  </div>
                  <div>
                    <span class="placeholder col-4"></span>
                    <span class="placeholder col-5"></span>
                  </div>
                  <div>
                    <span class="placeholder col-9"></span>
                    <span class="placeholder col-1"></span>
                  </div>
                </div>
                <div class="h300px bg-fb5"></div>
              </div>

              <!-- 中間區塊-3 -->
              <!-- 3-1 -->
              <div class="card-footer bg-white border-top-0">
                <ul class="nav justify-content-between border-bottom">
                  <!-- 左 -->
                  <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fa-solid fa-thumbs-up"></i></a>
                  </li>
                  <!-- 右 -->
                  <li class="nav-item">
                    <a class="nav-link" href="#">
                      分享次數
                    </a>
                  </li>
                </ul>

                <!-- 3-2 -->
                <div class="nav justify-content-around">
                  <a class="nav-link active" aria-current="page" href="#"><i class="fa-solid fa-thumbs-up"></i>讚</a>
                  <a class="nav-link" href="#"><i class="fa-regular fa-message"></i>回應</a>
                  <a class="nav-link" href="#"><i class="fa-solid fa-share"></i>分享</a>
                </div>

              </div>
            </div>

            <!-- CARD-2 -->
          <!-- 中間區塊-1 -->
          <div class="col py-2 placeholder-glow">
            <div class="card">
              <div class="card-header bg-white border-bottom-0">
                <div class="d-flex gap-1">
                  <div class="img-head placeholder w50px h50px bg-fb3 rounded-circle"></div>
                  <div class="flex-fill">
                  <!-- 1-1 -->
                    <div>
                      <span class="placeholder col-6"></span>
                    </div>
                  <!-- 1-2 -->
                    <div>
                      <span class="placeholder col-2"></span>
                      <i class="fa-solid fa-earth-americas"></i>
                    </div>
                  </div>
                  <div class="ms-auto">
                    <i class="fa-solid fa-ellipsis "></i>
                  </div>
                </div>
              </div>

              <!-- 中間區塊-2 -->
              <div class="card-body px-0">
                <div class="px-3 pb-2">
                  <div>
                    <span class="placeholder col-6"></span>
                    <span class="placeholder col-2"></span>
                  </div>
                  <div>
                    <span class="placeholder col-4"></span>
                    <span class="placeholder col-5"></span>
                  </div>
                  <div>
                    <span class="placeholder col-9"></span>
                    <span class="placeholder col-1"></span>
                  </div>
                </div>
                <div class="h300px bg-fb5"></div>
              </div>

              <!-- 中間區塊-3 -->
              <!-- 3-1 -->
              <div class="card-footer bg-white border-top-0">
                <ul class="nav justify-content-between border-bottom">
                  <!-- 左 -->
                  <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fa-solid fa-thumbs-up"></i></a>
                  </li>
                  <!-- 右 -->
                  <li class="nav-item">
                    <a class="nav-link" href="#">
                      分享次數
                    </a>
                  </li>
                </ul>

                <!-- 3-2 -->
                <div class="nav justify-content-around">
                  <a class="nav-link active" aria-current="page" href="#"><i class="fa-solid fa-thumbs-up"></i>讚</a>
                  <a class="nav-link" href="#"><i class="fa-regular fa-message"></i>回應</a>
                  <a class="nav-link" href="#"><i class="fa-solid fa-share"></i>分享</a>
                </div>

              </div>
            </div>
          </div>
          </div>

          

          <div class="col-3">
            <div class="card rounded-0 rounded-bottom">
              <div class="card-body pt-0">
                <div class="h200px bg-fb5">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" ></script>
    <script>
      const searchBar = document.querySelector("#search-bar");

      searchBar.addEventListener("focusin", (event) => {
        event.currentTarget.classList.add("w400px");
      });

      searchBar.addEventListener("focusout", (event) => {
        event.currentTarget.classList.remove("w400px");
      });
    </script>
  </body>
</html>
