<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .container{
      width: 100%;
      height: 240px;
      background-color: #e4e4e4;
      display: flex;
      align-items: flex-end;
      gap: 10px;

      .col{
        width: 80px;
        height: 60px;
        background-color: #7c7c7c;
        display: flex;
        justify-content: center;
        align-items: center;

        &.col-2{
        height: 120px;
        margin-left: auto;
        
        &.col-3{
        height: 90px;
    
      
      }
    }
  </style>
  <title>Flex 長條圖 1</title>
</head>
<body>
  <div class="container">
    <!-- .col*3.col-$>{$} -->
    <div class="col col-1">1</div>
    <div class="col col-2">2</div>
    <div class="col col-3">3</div>
  </div>
</body>
</html>
